<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Season One team</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23F3E9D2%22/%3E%3Crect x=%228%22 y=%228%22 width=%2216%22 height=%2216%22 rx=%223%22 fill=%22none%22 stroke=%22%23FF4D8D%22 stroke-width=%223%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap&subset=latin">
<link rel="stylesheet" href="./styles.css">
<style>
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 56px; display: flex; flex-direction: column; gap: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: .875rem; overflow-wrap: anywhere; min-width: 0; }
  .card .mono { font-size: .8125rem; }
  .inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .inline .btn { width: auto; }
  .inline .input { flex: 1; min-width: 140px; }
</style>
</head>
<body>
<main class="wrap">
  <h1 class="headline">Season One team</h1>
  <form class="inline" id="key"><label class="field" style="flex:1"><span>Team key</span><input class="input" name="key" type="password" autocomplete="off"></label><button class="btn btn-primary">Open</button></form>
  <div id="out" class="stack"></div>
</main>
<script type="module" src="./admin.ts"></script>
</body>
</html>
